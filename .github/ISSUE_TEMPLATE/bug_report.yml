name: Bug report
description: Something does not work, or protects less than it claims to
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ### Before you write anything: do not paste your real data

        This tracker is public and permanent. Use synthetic values — the ones
        in `config/redact-rules.example.json` exist for this.

        Most of the tooling here is already values-free on purpose and is
        safe to paste:

        ```
        npm run doctor     verdicts and counts, never a value
        npm run verify     same
        npm run scan       counts by category
        ```

        **Never attach `PII-AUDIT*.txt`, `LITERAL-AUDIT*.txt`, a raw change
        log, or your `redact-rules.json`.** Those hold real values by design.

        If the bug is that **personal data reached the API**, do not describe
        it here — report it privately via **Security → Report a
        vulnerability**. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run doctor`
      description: Values-free by design, so it is safe to paste in full.
      render: text
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        Steps, with synthetic values. If it involves a specific pattern or
        literal, give one that is obviously fake but has the same SHAPE —
        the shape is usually what matters.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Redaction (a value was or was not redacted)
        - Resolution (a tool got a label instead of the real value)
        - Egress / IP masking
        - Residue scrub (transcripts on disk)
        - Supervisor (logon, watchdog, restarts)
        - Dashboard
        - Setup / install
        - Not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: "Windows 11, Node 20.11.0"
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: This report contains no real personal data of mine or anyone else's
          required: true
        - label: I have read the out-of-scope list in SECURITY.md
          required: false
